name: Cleanup Preview Deployment

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete preview deployments
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "Deleting all deployments for branch: $BRANCH"

          DEPLOYMENTS=$(curl -s \
            --url "https://api.vercel.com/v7/deployments?projectId=${{ secrets.VERCEL_PROJECT_ID }}&target=preview&limit=100" \
            --header "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            | jq -r --arg branch "$BRANCH" '.deployments[] | select(.meta.githubCommitRef == $branch) | .uid')

          if [ -z "$DEPLOYMENTS" ]; then
            echo "No deployments found for branch $BRANCH, skipping"
            exit 0
          fi

          for ID in $DEPLOYMENTS; do
            echo "Deleting deployment $ID"
            curl --request DELETE \
              --url "https://api.vercel.com/v13/deployments/$ID" \
              --header "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}"
          done

  # Counterpart of stripe-preview.yml: remove the branch webhook endpoint from the
  # preview sandbox and the branch-scoped STRIPE_WEBHOOK_SECRET env, so the
  # 16-endpoints-per-account Stripe limit never fills up.
  stripe-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Stripe webhook endpoint for this branch
        env:
          STRIPE_KEY: ${{ secrets.STRIPE_PREVIEW_KEY }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # Endpoints were registered on the stable -git- branch alias; match on
          # the description we set at create time (contains the branch name) OR
          # any -git-<slugged-branch>- alias URL, then delete.
          SLUG=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')
          IDS=$(curl -sf "https://api.stripe.com/v1/webhook_endpoints?limit=100" -H "Authorization: Bearer $STRIPE_KEY" \
            | jq -r --arg b "preview $BRANCH (auto, stripe-preview.yml)" --arg slug "-git-$SLUG" \
              '.data[] | select(.description == $b or (.url | contains($slug))) | .id')
          if [ -z "$IDS" ]; then
            echo "No Stripe webhook endpoint found for branch $BRANCH, skipping"
            exit 0
          fi
          for ID in $IDS; do
            echo "Deleting Stripe webhook endpoint $ID"
            curl -sf --request DELETE "https://api.stripe.com/v1/webhook_endpoints/$ID" -H "Authorization: Bearer $STRIPE_KEY" >/dev/null
          done

      - name: Delete branch-scoped STRIPE_WEBHOOK_SECRET from Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          ENV_IDS=$(curl -sf "https://api.vercel.com/v9/projects/$PROJECT_ID/env" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            | jq -r --arg b "$BRANCH" \
              '.envs[] | select(.key == "STRIPE_WEBHOOK_SECRET" and .gitBranch == $b) | .id')
          if [ -z "$ENV_IDS" ]; then
            echo "No branch-scoped STRIPE_WEBHOOK_SECRET for $BRANCH, skipping"
            exit 0
          fi
          for ID in $ENV_IDS; do
            echo "Deleting env $ID"
            curl -sf --request DELETE "https://api.vercel.com/v9/projects/$PROJECT_ID/env/$ID" \
              -H "Authorization: Bearer $VERCEL_TOKEN" >/dev/null
          done
