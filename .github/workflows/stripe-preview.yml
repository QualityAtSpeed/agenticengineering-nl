name: Stripe Preview Webhook

# Gives every preview deployment a working Stripe webhook against the shared
# preview sandbox. Stripe sandboxes cannot be created via API (Dashboard-only,
# max ~5 per account), so all previews share ONE sandbox; isolation happens at
# the webhook level: each PR branch gets its own webhook endpoint + secret,
# registered on the stable Vercel branch alias (<project>-git-<branch>-….vercel.app).
#
# Flow per preview deploy (idempotent — safe on every push):
#   1. Resolve the deployment via the Vercel API → branch + stable -git- alias.
#   2. Ensure a Stripe webhook endpoint exists for that alias (create if missing).
#   3. If newly created: store its whsec_ as a branch-scoped Vercel env
#      (STRIPE_WEBHOOK_SECRET, target=preview) and redeploy once so the
#      running preview picks it up. Subsequent pushes find the endpoint and skip.
#
# Cleanup on PR close lives in preview-teardown.yml.
# Secrets: VERCEL_TOKEN / VERCEL_PROJECT_ID (existing) + STRIPE_PREVIEW_KEY
# (restricted key from the preview sandbox, permission "Webhook Endpoints: Write").

on:
  deployment_status:

jobs:
  webhook:
    if: >-
      github.event.deployment_status.state == 'success'
      && github.event.deployment.environment != 'Production'
      && github.event.deployment_status.environment_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve deployment, branch and stable alias
        id: meta
        env:
          DEPLOY_URL: ${{ github.event.deployment_status.environment_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          HOST="${DEPLOY_URL#https://}"
          DEPLOYMENT=$(curl -sf "https://api.vercel.com/v13/deployments/get?url=$HOST" \
            -H "Authorization: Bearer $VERCEL_TOKEN")
          BRANCH=$(echo "$DEPLOYMENT" | jq -r '.meta.githubCommitRef // empty')
          DEPLOY_ID=$(echo "$DEPLOYMENT" | jq -r '.id')
          PROJECT_NAME=$(echo "$DEPLOYMENT" | jq -r '.name')
          # The -git- alias is the stable per-branch URL we register the webhook on.
          GIT_ALIAS=$(echo "$DEPLOYMENT" | jq -r '[.alias[]? | select(contains("-git-"))] | first // empty')
          if [ -z "$BRANCH" ] || [ -z "$GIT_ALIAS" ]; then
            echo "No branch or -git- alias on this deployment (branch='$BRANCH', alias='$GIT_ALIAS') — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
          echo "project_name=$PROJECT_NAME" >> "$GITHUB_OUTPUT"
          echo "webhook_url=https://$GIT_ALIAS/api/stripe/webhook" >> "$GITHUB_OUTPUT"

      - name: Ensure Stripe webhook endpoint for this branch
        id: stripe
        if: steps.meta.outputs.skip != 'true'
        env:
          STRIPE_KEY: ${{ secrets.STRIPE_PREVIEW_KEY }}
          WEBHOOK_URL: ${{ steps.meta.outputs.webhook_url }}
        run: |
          EXISTING=$(curl -sf "https://api.stripe.com/v1/webhook_endpoints?limit=100" \
            -u "$STRIPE_KEY:" | jq -r --arg url "$WEBHOOK_URL" \
            '[.data[] | select(.url == $url)] | first | .id // empty')
          if [ -n "$EXISTING" ]; then
            echo "Endpoint $EXISTING already registered for $WEBHOOK_URL — nothing to do."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CREATED=$(curl -sf "https://api.stripe.com/v1/webhook_endpoints" \
            -u "$STRIPE_KEY:" \
            -d "url=$WEBHOOK_URL" \
            -d "enabled_events[]=checkout.session.completed" \
            -d "description=preview ${{ steps.meta.outputs.branch }} (auto, stripe-preview.yml)")
          SECRET=$(echo "$CREATED" | jq -r '.secret')
          echo "::add-mask::$SECRET"
          echo "Created endpoint $(echo "$CREATED" | jq -r '.id') for $WEBHOOK_URL"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "secret=$SECRET" >> "$GITHUB_OUTPUT"

      - name: Store branch-scoped STRIPE_WEBHOOK_SECRET and redeploy
        if: steps.stripe.outputs.created == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          SECRET: ${{ steps.stripe.outputs.secret }}
          DEPLOY_ID: ${{ steps.meta.outputs.deploy_id }}
          PROJECT_NAME: ${{ steps.meta.outputs.project_name }}
        run: |
          curl -sf -X POST \
            "https://api.vercel.com/v10/projects/$PROJECT_ID/env?upsert=true" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg v "$SECRET" --arg b "$BRANCH" \
              '{key:"STRIPE_WEBHOOK_SECRET", value:$v, type:"sensitive", target:["preview"], gitBranch:$b}')" \
            | jq -r '"env stored: " + (.created.key // .key // "ok")'
          # One-time redeploy so the already-built preview picks up the new secret.
          # Later pushes build with the env present and hit the endpoint-exists fast path.
          curl -sf -X POST "https://api.vercel.com/v13/deployments?forceNew=1" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg id "$DEPLOY_ID" --arg name "$PROJECT_NAME" \
              '{deploymentId:$id, name:$name, target:"preview"}')" \
            | jq -r '"redeploy started: " + .id'
