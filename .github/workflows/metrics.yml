name: Pipeline Metrics

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compute metrics report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm metrics >> "$GITHUB_STEP_SUMMARY"
