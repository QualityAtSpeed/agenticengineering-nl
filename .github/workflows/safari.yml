name: Safari E2E

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safari:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps webkit
      - run: pnpm test:e2e -- --project=webkit --retries=2
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY_E2E }}
          CONTACT_EMAIL: delivered@resend.dev
          CONTACT_FROM_EMAIL: onboarding@resend.dev
          E2E_LIVE_API: ${{ secrets.RESEND_API_KEY_E2E != '' && '1' || '' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-safari
          path: playwright-report/
