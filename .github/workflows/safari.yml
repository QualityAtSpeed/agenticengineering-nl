name: Safari E2E

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safari:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps webkit
      - run: pnpm exec playwright test --project=webkit --retries=2
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY_E2E }}
          CONTACT_EMAIL: delivered@resend.dev
          CONTACT_FROM_EMAIL: onboarding@resend.dev
          E2E_LIVE_API: ${{ secrets.RESEND_API_KEY_E2E != '' && '1' || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report-safari
          path: playwright-report/
