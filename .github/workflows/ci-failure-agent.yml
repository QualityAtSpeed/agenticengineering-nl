name: CI  FAilure Analysis

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# Alleen runs en logs lezen. Er wordt geen code uitgecheckt en niets geschreven.
permissions:
  actions: read

jobs:
  notify:
    name: Rode CI-run naar BenLokaal
    # Alleen bij rood, alleen voor PR-runs uit deze repo (nooit uit een fork),
    # en alleen als er een PR aan hangt
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post naar #benlokaal-development
        # Alles via env, nooit ${{ }} in het script zelf (tegen script-injectie)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WEBHOOK: ${{ secrets.BENLOKAAL_WEBHOOK }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          PR_URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          if [ -z "${WEBHOOK:-}" ]; then
            echo "::warning::secret BENLOKAAL_WEBHOOK ontbreekt; niets gepost"
            exit 0
          fi

          # Welke job en stap faalden
          gefaald=$(gh run view "$RUN_ID" --json jobs \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name + " / " + ([.steps[] | select(.conclusion == "failure") | .name] | join(", "))] | join("; ")' \
            || echo "onbekend")

          # Log van de gefaalde stappen, zonder job- en stapkolom, tijdstempels,
          # kleurcodes en lege regels. ``` wordt ''' zodat het codeblok heel blijft.
          log=$(gh run view "$RUN_ID" --log-failed \
            | cut -f3- \
            | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z ?//; s/\x1b\[[0-9;]*[A-Za-z]//g' \
            | sed -E "s/\`{3}/'''/g" \
            | grep -v -E '^[[:space:]]*$|^##\[(group|endgroup)\]' \
            || true)

          kop="CI rood op PR #${PR_NUMBER} in ${GH_REPO}.
          Zoek uit waarom: de code, een test die soms faalt, de testdata of de runner (te druk, netwerk)? Antwoord met Oorzaak, Waar (bestand:regel), Uitleg en Mogelijke fix. Pas niets aan en push niets.
          PR: <${PR_URL}>
          Run: <${RUN_URL}>
          Commit: ${HEAD_SHA} (${HEAD_BRANCH})
          Gefaald: ${gefaald:0:300}
          Laatste logregels:"

          # Discord staat 2000 tekens per bericht toe. Wat na de kop overblijft,
          # gaat naar het einde van de log; de eerste, afgebroken regel valt weg.
          ruimte=$(( 1900 - ${#kop} ))
          if [ "${#log}" -gt "$ruimte" ]; then
            log=${log: -ruimte}
            log=${log#*$'\n'}
          fi

          # allowed_mentions leeg: een @everyone in de log pingt niemand
          jq -n --arg c "${kop}"$'\n```\n'"${log}"$'\n```' \
            '{content: $c, allowed_mentions: {parse: []}}' \
            | curl -sf -H "Content-Type: application/json" -X POST -d @- "$WEBHOOK"